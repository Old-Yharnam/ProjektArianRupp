name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python-backend-frontend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: PythonBackendFrontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: PythonBackendFrontend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall .

  esp-auswertung:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:release-v5.4

    defaults:
      run:
        working-directory: ESPCodeC/AnaeherungsSensor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESP-IDF project
        run: |
          idf.py build